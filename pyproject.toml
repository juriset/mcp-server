# A read-only mirror of the PyPI distribution `juriset-mcp`. Published from the Juriset
# monorepo; changes made here are not released (see README).
[project]
name = "juriset-mcp"
version = "0.1.1"
description = "MCP server for Juriset: verified, versioned, cited US and Canadian employment and payroll rules"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27,<1", "anyio>=4"]
keywords = ["mcp", "model-context-protocol", "employment-law", "payroll", "minimum-wage", "compliance"]

[project.urls]
Homepage = "https://juriset.dev"
Documentation = "https://juriset.dev/docs/mcp"
Source = "https://github.com/juriset/mcp-server"
Issues = "https://github.com/juriset/mcp-server/issues"

[project.scripts]
juriset-mcp = "juriset_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["juriset_mcp"]
